<!-- 1. Toast HTML Container -->
<div id="toast-notification" class="toast">
  <!-- Orange Alert Icon -->
  <span class="toast-icon">⚠️</span>
  <span class="toast-message">Warning: Your session is about to expire!</span>
  <button class="toast-close" onclick="dismissToast()">&times;</button>
</div>

<!-- 2. Toast CSS Styling -->
<style>
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #ff9800; /* Vibrant Orange Background */
    color: #111111; /* Dark text for high contrast readability */
    padding: 14px 24px;
    border-radius: 8px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: system-ui, -apple-system, sans-serif;
    font-weight: 500;
    font-size: 14px;
    z-index: 1000;
    
    /* Animation Properties */
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }

  /* When the toast is active/visible */
  .toast.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* Warning Icon Tweak */
  .toast-icon {
    font-size: 16px;
  }

  /* Close Button Style */
  .toast-close {
    background: none;
    border: none;
    color: rgba(0, 0, 0, 0.6);
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    margin-left: 8px;
  }

  .toast-close:hover {
    color: #000;
  }
</style>

<!-- 3. Toast JavaScript Logic -->
<script>
  let toastTimeout;

  // This event fires automatically as soon as the page loads
  window.addEventListener('DOMContentLoaded', () => {
    // Small delay (500ms) so the page settles before the toast slides in
    setTimeout(() => {
      showToast();
    }, 500);
  });

  function showToast(message) {
    const toast = document.getElementById('toast-notification');
    
    if (message) {
      toast.querySelector('.toast-message').textContent = message;
    }

    clearTimeout(toastTimeout);
    toast.classList.add('show');

    // Automatically hide after 5 seconds
    toastTimeout = setTimeout(() => {
      dismissToast();
    }, 5000);
  }

  function dismissToast() {
    const toast = document.getElementById('toast-notification');
    toast.classList.remove('show');
  }
</script>
